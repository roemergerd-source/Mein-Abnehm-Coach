<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Abnehm-Coach</title><style>body{font:18px system-ui;background:#eef4f0;color:#17352b;margin:20px}button,input,textarea{font:inherit;padding:12px;box-sizing:border-box}button{background:#21664b;color:white;border:0;border-radius:6px;margin:4px 0}nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}section{background:white;padding:16px;border-radius:10px;margin-top:16px}input,textarea{width:100%;margin:6px 0}label{display:block;margin:12px 0}input[type=checkbox]{width:24px;height:24px}small{font-size:14px}progress{width:100%}h1{font-size:25px;margin:8px 0 18px}body{padding-top:24px}small{font-size:11px}nav button{min-height:48px}progress{accent-color:#21664b}.lamp{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px}</style><h1>Mein Abnehm-Coach</h1><nav id="nav"></nav><section id="panel"></section><small>© Leobeck 2026 · Kein Ersatz für ärztliche Betreuung.</small><script>
const key='coach-v1',s=JSON.parse(localStorage.getItem(key)||'{"weights":[],"days":{}}');const now=new Date(),date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');const d=s.days[date]||(s.days[date]={water:0,checks:{}});let tab=0;const save=()=>localStorage.setItem(key,JSON.stringify(s));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['Übersicht','Ernährung','Bewegung','Gesundheit','Gewicht','Auswertung'];nav.innerHTML=names.map((n,i)=>'<button onclick="show('+i+')">'+n+'</button>').join('');function check(k,t){return '<label><input type="checkbox" '+(d.checks[k]?'checked':'')+' onchange="d.checks['+k+']=this.checked;save()">'+t+'</label>'}function lamp(n,v,max){return '<p><span class="lamp" style="background:'+(v===max?'#219653':v?'#e4ad20':'#c94a4a')+'"></span>'+n+': '+v+'/'+max+'</p>'}function show(i){tab=i;[...nav.children].forEach((b,j)=>b.style.background=i===j?'#17352b':'#438369');let w=s.weights.at(-1)?.w??140;let p=Math.max(0,Math.min(100,(140-w)*10));let h='';if(i===0){h='<h2>'+w+' kg → 130 kg</h2><progress max="100" value="'+p+'"></progress><p>Veränderung: '+(140-w).toFixed(1)+' kg abgenommen</p><p>Zieltermin: 26.02.2027</p>'+lamp('Ernährung',[0,1,2,3,4].filter(k=>d.checks[k]).length,5)+lamp('Bewegung',[5,6,7].filter(k=>d.checks[k]).length,3)+'<small>Ampel: Aufgabenstatus, keine medizinische Bewertung.</small><p>Getrunken: '+d.water+' ml</p>'}if(i===1){h='<h2>Ernährung</h2><p>Beispielmenü, kleine verträgliche Portionen. Eiweiß zuerst; nicht über Sättigung hinaus essen.</p>'+['08:00 Rührei und Vollkornbrot','10:30 Skyr und Beeren','12:30 Hähnchen, Kartoffeln, Gemüse','15:30 Quark und Obst','18:00 Frischkäse und Vollkornbrot'].map((t,j)=>check(j,t)).join('')+'<h3>Trinken: '+d.water+' ml</h3><button onclick="d.water+=250;save();show(1)">+ 250 ml</button> <button onclick="d.water=Math.max(0,d.water-250);save();show(1)">− 250 ml</button><p>Trinkziel ärztlich abstimmen.</p>'}if(i===2){h='<h2>Bewegung</h2><p>Nur ärztlich freigegeben und schmerzfrei. Bei Atemnot, Schwindel oder Schmerzen abbrechen.</p>'+['Kurzer Spaziergang vormittags','Schonende Sitzgymnastik','Kurzer Spaziergang nachmittags'].map((t,j)=>check(j+5,t)).join('')}if(i===3){h='<h2>Gesundheit</h2>'+['Blutdruck (mmHg)','Blutzucker mit Einheit','Beschwerden'].map((t,j)=>'<label>'+t+'<input value="'+esc(d['v'+j])+'" onchange="d[\'v'+j+'\']=this.value;save()"></label>').join('')+'<p>Medikamente nicht eigenständig ändern.</p>'}if(i===4){h='<h2>Gewicht erfassen</h2><input id="kg" type="number" min="30" max="350" step="0.1" value="'+w+'"><button onclick="record()">Messung speichern</button><p id="msg"></p>'}if(i===5){h='<h2>Gewichtsverlauf</h2>'+s.weights.map(x=>'<p>'+esc(x.date)+' — '+x.w+' kg</p>').join('')+'<button onclick="exportData()">Protokoll anzeigen</button><textarea id="out" readonly hidden></textarea>'}panel.innerHTML=h}function record(){let w=Number(document.getElementById('kg').value);if(!Number.isFinite(w)||w<30||w>350){msg.textContent='Bitte gültiges Gewicht eingeben';return}s.weights.push({date,w});save();msg.textContent='Gespeichert'}function exportData(){out.hidden=false;out.value=JSON.stringify(s,null,2);out.select()}show(0);
</script></html>
