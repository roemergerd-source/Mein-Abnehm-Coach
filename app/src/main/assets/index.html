<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Abnehm-Coach</title><style>body{font:18px system-ui;background:#eef4f0;color:#17352b;margin:20px}button,input,textarea{font:inherit;padding:12px;box-sizing:border-box}button{background:#21664b;color:white;border:0;border-radius:6px;margin:4px 0}nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}section{background:white;padding:16px;border-radius:10px;margin-top:16px}input,textarea{width:100%;margin:6px 0}label{display:block;margin:12px 0}input[type=checkbox]{width:24px;height:24px}small{font-size:14px}progress{width:100%}h1{font-size:25px;margin:8px 0 18px}body{padding-top:0}small{font-size:11px}nav button{min-height:48px}progress{accent-color:#21664b}.lamp{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px}body{padding-bottom:12px}section{padding:12px}section p{margin:12px 0}section h2{margin:12px 0}section h3{margin:16px 0 4px}section svg{max-height:170px}label:has(input[type=checkbox]){display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}label:has(input[type=checkbox]) small{grid-column:2}input[type=checkbox]{accent-color:#21664b}details{padding:10px 0;border-bottom:1px solid #ddd}summary{cursor:pointer}button:focus-visible{outline:3px solid #b78c32}input,textarea{border:1px solid #9aaea3;border-radius:6px}button{min-height:44px}small{line-height:1.5}nav button{overflow-wrap:anywhere} </style><h1>Mein Abnehm-Coach</h1><nav id="nav"></nav><section id="panel"></section><button style="width:100%;margin-top:16px" onclick="location.href='coach://close'">App schließen</button><br><small>© Leobeck 2026 · Kein Ersatz für ärztliche Betreuung.</small><script>
const key='coach-v1';let s=JSON.parse(localStorage.getItem(key)||'{"weights":[],"days":{}}');let now=new Date();const dayKey=n=>n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');let date=dayKey(now),d=s.days[date]||(s.days[date]={water:0,checks:{}});function refreshDay(){let n=new Date();if(dayKey(n)!==date){now=n;date=dayKey(n);d=s.days[date]||(s.days[date]={water:0,checks:{}});show(tab);}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay()});setInterval(refreshDay,30000);let tab=0;const defaults={start:140,target:130,from:'2026-11-26',until:'2027-02-26'};function validGoals(a){return a&&Number.isFinite(a.start)&&Number.isFinite(a.target)&&a.start<=350&&a.target>=30&&a.start>a.target&&/^\d{4}-\d{2}-\d{2}$/.test(a.from)&&/^\d{4}-\d{2}-\d{2}$/.test(a.until)&&Date.parse(a.until)>Date.parse(a.from)}function goals(){return validGoals(s.goals)?s.goals:defaults}function fmt(k){return k.split('-').reverse().join('.')}function saveGoals(){let a={start:Number(document.getElementById('gs').value),target:Number(document.getElementById('gt').value),from:document.getElementById('gf').value,until:document.getElementById('gu').value};if(!validGoals(a)){document.getElementById('gm').textContent='Bitte gültige Gewichte und einen späteren Zieltermin eingeben.';return} s.goals=a;save();show(4);document.getElementById('gm').textContent='Ziele gespeichert.'}const save=()=>localStorage.setItem(key,JSON.stringify(s));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const menus=[["08:00 Skyr, Haferflocken, Beeren","10:30 Ei und Gurke","12:30 Hähnchen, Kartoffeln, Brokkoli","15:30 Quark und Apfel","18:00 Vollkornbrot und Frischkäse"],["08:00 Rührei und Vollkornbrot","10:30 Naturjoghurt","12:30 Seelachs, Kartoffeln, Möhren","15:30 Skyr und Beeren","18:00 Hüttenkäse und Tomate"],["08:00 Quark, Haferflocken, Birne","10:30 Ei","12:30 Putenbrust, Reis, Zucchini","15:30 Naturjoghurt und Nüsse","18:00 Vollkornbrot und Käse"],["08:00 Haferbrei mit Skyr","10:30 Hüttenkäse","12:30 Linsen mit Gemüse und Ei","15:30 Quark und Beeren","18:00 Vollkornbrot und Putenbrust"],["08:00 Omelett und Tomate","10:30 Skyr","12:30 Lachs, Kartoffeln, Spinat","15:30 Quark und Birne","18:00 Frischkäse und Vollkornbrot"],["08:00 Skyr und Haferflocken","10:30 Ei und Tomate","12:30 Hähnchen, Reis, Gemüse","15:30 Joghurt und Apfel","18:00 Hüttenkäse und Gurke"],["08:00 Vollkornbrot und Ei","10:30 Quark und Beeren","12:30 Pute, Kartoffeln, Blumenkohl","15:30 Skyr","18:00 Käse und Vollkornbrot"]];const names=['Übersicht','Ernährung','Bewegung','Gesundheit','Gewicht','Auswertung'];nav.innerHTML=names.map((n,i)=>'<button onclick="show('+i+')">'+n+'</button>').join('');function check(k,t){return '<label><input type="checkbox" '+(d.checks[k]?'checked':'')+' onchange="d.checks['+k+']=this.checked;save()">'+t+'</label>'}function lamp(n,v,max){return '<p><span class="lamp" style="background:'+(v===max?'#219653':v?'#e4ad20':'#888')+'"></span>'+n+': '+v+'/'+max+'</p>'}function graph(){const q=goals(),start=Date.parse(q.from),end=Date.parse(q.until),pts=s.weights.filter(a=>Number.isFinite(a.w)&&Number.isFinite(Date.parse(a.date)));const lo=Math.min(q.target,...pts.map(a=>a.w))-1,hi=Math.max(q.start,...pts.map(a=>a.w))+1;const x=t=>36+Math.max(0,Math.min(1,(t-start)/(end-start)))*240,y=w=>15+(hi-w)/(hi-lo)*115;return '<h3>Gewichtsverlauf</h3><svg viewBox="0 0 300 155" width="100%" role="img" aria-label="Gewichtsverlauf">'+[q.target,(q.target+q.start)/2,q.start].map(w=>'<line x1="36" x2="276" y1="'+y(w)+'" y2="'+y(w)+'" stroke="#ddd"/><text x="2" y="'+(y(w)+4)+'" font-size="10">'+w+'</text>').join('')+'<path d="M36 '+y(q.start)+' L276 '+y(q.target)+'" stroke="#438369" stroke-dasharray="5 4" fill="none"/>'+pts.map(a=>'<circle cx="'+x(Date.parse(a.date))+'" cy="'+y(a.w)+'" r="4" fill="#2466b0"/>').join('')+'<text x="36" y="150" font-size="10">'+fmt(q.from).slice(0,6)+'</text><text x="240" y="150" font-size="10">'+fmt(q.until).slice(0,6)+'</text></svg><small>Gestrichelt: Wunschziel. Blau: Messwerte. Außerhalb des Zielzeitraums liegende Werte am Rand.</small>'} const portions=[['150 g Skyr, 25 g Hafer, 50 g Beeren','1 Ei, 50 g Gurke','100 g Hähnchen, 100 g Kartoffeln, 80 g Brokkoli, 5 g Öl','150 g Quark, 80 g Apfel','60 g Brot, 100 g körniger Frischkäse'],['2 Eier, 40 g Brot','150 g Naturjoghurt','120 g Seelachs, 100 g Kartoffeln, 80 g Möhren, 5 g Öl','150 g Skyr, 50 g Beeren','150 g Hüttenkäse, 80 g Tomate'],['150 g Quark, 25 g Hafer, 50 g Birne','1 Ei','100 g Pute, 100 g gekochter Reis, 80 g Zucchini, 5 g Öl','150 g Joghurt, 15 g Nüsse','60 g Brot, 40 g Käse'],['25 g Hafer, 150 g Skyr','150 g Hüttenkäse','100 g gekochte Linsen, 80 g Gemüse, 1 Ei, 5 g Öl','150 g Quark, 50 g Beeren','60 g Brot, 80 g Putenaufschnitt'],['2 Eier, 80 g Tomate','150 g Skyr','100 g Lachs, 100 g Kartoffeln, 80 g Spinat','150 g Quark, 50 g Birne','100 g körniger Frischkäse, 60 g Brot'],['150 g Skyr, 25 g Hafer','1 Ei, 80 g Tomate','100 g Hähnchen, 100 g gekochter Reis, 80 g Gemüse, 5 g Öl','150 g Joghurt, 80 g Apfel','150 g Hüttenkäse, 80 g Gurke'],['40 g Brot, 2 Eier','150 g Quark, 50 g Beeren','100 g Pute, 100 g Kartoffeln, 80 g Blumenkohl, 5 g Öl','150 g Skyr','40 g Käse, 60 g Brot']];const nutrition=[[[210,20],[85,7],[280,34],[145,18],[230,17]],[[240,16],[95,5],[240,25],[120,16],[160,19]],[[220,21],[80,7],[320,32],[190,8],[300,15]],[[190,19],[150,18],[250,16],[125,18],[230,20]],[[175,14],[95,16],[315,24],[130,18],[230,17]],[[190,19],[95,7],[320,34],[135,5],[160,19]],[[240,16],[125,18],[265,32],[95,16],[300,15]]];function menuDetails(){let a=nutrition[now.getDay()];return '<p><strong>Beispielportionen:</strong> '+a.reduce((v,x)=>v+x[0],0)+' kcal / '+a.reduce((v,x)=>v+x[1],0)+' g Eiweiß (grob geschätzt). Dies ist ausdrücklich kein vollständiger Tagesbedarf. Ergänzungen und Tagesziel mit Ernährungsmedizin abstimmen; nicht als Kalorienobergrenze verwenden.</p><details><summary>Einkaufsliste heute</summary>'+portions[now.getDay()].map(t=>'<p>'+t+'</p>').join('')+'</details>'}function monthly(){let a=s.weights.filter(x=>Date.parse(x.date)>=Date.parse(date)-29*86400000&&x.date<=date).sort((x,y)=>x.date.localeCompare(y.date));return '<h3>Letzte 30 Tage</h3><p>Messungen: '+a.length+'</p><p>'+(a.length<2?'Noch nicht genügend Messungen.':'Gewichtsänderung: '+(a.at(-1).w-a[0].w).toFixed(1)+' kg · Durchschnitt: '+(a.reduce((v,x)=>v+x.w,0)/a.length).toFixed(1)+' kg')+'</p>'}function weekly(){let a=s.weights.filter(x=>Date.parse(x.date)>=Date.parse(date)-6*86400000&&Date.parse(x.date)<=Date.parse(date)).sort((x,y)=>x.date.localeCompare(y.date));return '<h3>Letzte 7 Tage</h3><p>'+ (a.length<2?'Noch nicht genügend Messungen für einen Vergleich.': 'Veränderung zwischen erster und letzter Messung: '+(a.at(-1).w-a[0].w).toFixed(1)+' kg')+'</p><p>Keine automatische Verschärfung der Diät. Bei Beschwerden ärztlich abklären.</p>'} function show(i){if(tab!==i)window.scrollTo(0,0);tab=i;[...nav.children].forEach((b,j)=>b.style.background=i===j?'#17352b':'#438369');let last=[...s.weights].sort((a,b)=>a.date.localeCompare(b.date)).at(-1),q=goals(),w=last?.w??q.start;let p=last?Math.max(0,Math.min(100,(q.start-w)/(q.start-q.target)*100)):0;let h='';if(i===0){h='<h2>'+w+' kg → '+q.target+' kg</h2><small>'+ (s.weights.length?'Letzte gespeicherte Messung':'Startwert (noch keine Messung)')+' · '+esc((last?.date||date).split('-').reverse().join('.'))+'</small><progress max="100" value="'+p+'"></progress><p>Veränderung: '+(last?Math.abs(q.start-w).toFixed(1)+' kg '+(w>q.start?'zugenommen':'abgenommen'):'Noch keine Messung')+'</p><p>Zieltermin: '+fmt(q.until)+'</p>'+lamp('Ernährung',[0,1,2,3,4].filter(k=>d.checks[k]).length,5)+lamp('Bewegung',[5,6,7].filter(k=>d.checks[k]).length,3)+'<small>Ampel: Aufgabenstatus, keine medizinische Bewertung.</small><p>Getrunken: '+d.water+' ml</p>'}if(i===1){h='<h2>Ernährung</h2><p>Wechselndes Wochenmenü, kleine verträgliche Portionen. Eiweiß zuerst; nicht über Sättigung hinaus essen.</p>'+menus[now.getDay()].map((t,j)=>check(j,t+'<br><small>'+portions[now.getDay()][j]+' · ca. '+nutrition[now.getDay()][j][0]+' kcal / '+nutrition[now.getDay()][j][1]+' g Eiweiß</small>')).join('')+menuDetails()+'<h3>Zusätzliche Mahlzeiten</h3><p>Hier kannst du weitere tatsächlich gegessene Lebensmittel dokumentieren.</p><input id="extraFood" maxlength="250" placeholder="Lebensmittel und Menge"><button onclick="addFood()">Hinzufügen</button>'+ (d.extra||[]).map((t,j)=>'<p>'+esc(t)+' <button onclick="removeFood('+j+')">Entfernen</button></p>').join('')+'<h3>Trinken: '+d.water+' ml</h3><button onclick="d.water+=100;save();show(1)">+ 100 ml</button> <button onclick="d.water+=250;save();show(1)">+ 250 ml</button> <button onclick="d.water=Math.max(0,d.water-100);save();show(1)">− 100 ml</button> <button onclick="d.water=Math.max(0,d.water-250);save();show(1)">− 250 ml</button><p>Trinkziel ärztlich abstimmen.</p>'}if(i===2){h='<h2>Bewegung</h2><p>Nur ärztlich freigegeben und schmerzfrei. Bei Atemnot, Schwindel oder Schmerzen abbrechen.</p>'+['Kurzer Spaziergang vormittags','Schonende Sitzgymnastik','Kurzer Spaziergang nachmittags'].map((t,j)=>check(j+5,t)).join('')}if(i===3){h='<h2>Gesundheit</h2>'+['Blutdruck (mmHg)','Blutzucker mit Einheit','Beschwerden'].map((t,j)=>'<label>'+t+'<input value="'+esc(d['v'+j])+'" onchange="d[\'v'+j+'\']=this.value;save()"></label>').join('')+'<p>Medikamente nicht eigenständig ändern. Bei akuter schwerer Atemnot, Brustschmerzen oder Bewusstseinsstörungen: 112.</p>'}if(i===4){h='<h2>Gewicht erfassen</h2><input id="kg" type="number" min="30" max="350" step="0.1" placeholder="Gewicht in kg" value="'+(last?w:'')+'"><button onclick="record()">Messung speichern</button><p id="msg"></p><details><summary>Persönliche Ziele einstellen</summary><p>Wunschziel mit ärztlicher Betreuung abstimmen.</p><label>Startgewicht (kg)<input id="gs" type="number" step="0.1" value="'+q.start+'"></label><label>Zielgewicht (kg)<input id="gt" type="number" step="0.1" value="'+q.target+'"></label><label>Startdatum<input id="gf" type="date" value="'+q.from+'"></label><label>Zieltermin<input id="gu" type="date" value="'+q.until+'"></label><button onclick="saveGoals()">Ziele speichern</button><p id="gm" role="status"></p></details>'}if(i===5){h='<h2>Gewichtsverlauf</h2>'+[...s.weights].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<p>'+esc(x.date)+' — '+x.w+' kg</p>').join('')+'<button onclick="exportData()">Datensicherung anzeigen</button><h3>Tagesprotokolle</h3>'+Object.keys(s.days).sort().reverse().slice(0,30).map(k=>{let a=s.days[k];return '<details><summary>'+esc(k)+'</summary><p>Getrunken: '+Number(a.water||0)+' ml</p><p>Ernährung: '+[0,1,2,3,4].filter(j=>a.checks?.[j]).length+'/5 · Bewegung: '+[5,6,7].filter(j=>a.checks?.[j]).length+'/3</p><p>Zusätzliche Mahlzeiten: '+esc((a.extra||[]).join('; ')||'Keine erfasst')+'</p><p>Blutdruck: '+esc(a.v0||'Nicht erfasst')+'</p><p>Blutzucker: '+esc(a.v1||'Nicht erfasst')+'</p><p>Beschwerden: '+esc(a.v2||'Nicht erfasst')+'</p></details>'}).join('')+'<textarea id="out" readonly hidden></textarea><p><small>Das Protokoll enthält persönliche Gesundheitsdaten. Nur sicher und privat aufbewahren.</small></p>'}if(i===0||i===5)h+=graph();if(i===5)h+=weekly()+monthly()+'<details><summary>Datensicherung wiederherstellen</summary><p>Füge ein zuvor gesichertes JSON-Protokoll ein. Die Wiederherstellung ersetzt die vorhandenen Daten.</p><textarea id="restore" placeholder="JSON-Sicherung einfügen"></textarea><button onclick="restoreData()">Sicherung wiederherstellen</button><p id="restoreMsg" role="status"></p></details>';panel.innerHTML=h}function record(){let w=Number(document.getElementById('kg').value);if(!Number.isFinite(w)||w<30||w>350){msg.textContent='Bitte gültiges Gewicht eingeben';return}s.weights=s.weights.filter(a=>a.date!==date);s.weights.push({date,w});save();msg.textContent='Messung für '+date+' gespeichert. Eine erneute Messung am selben Tag ersetzt diesen Wert.'}function addFood(){let t=document.getElementById('extraFood').value.trim();if(!t)return; (d.extra||(d.extra=[])).push(t);save();show(1)}function removeFood(i){d.extra.splice(i,1);save();show(1)}function restoreData(){try{const a=JSON.parse(document.getElementById('restore').value);if(!a||!Array.isArray(a.weights)||!a.days||typeof a.days!=='object'||Array.isArray(a.days))throw Error();const validDate=k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isFinite(Date.parse(k));if(a.weights.some(x=>!x||!validDate(x.date)||typeof x.w!=='number'||!Number.isFinite(x.w)||x.w<30||x.w>350))throw Error();for(const [k,v] of Object.entries(a.days)){if(!validDate(k)||!v||typeof v!=='object'||!Number.isFinite(v.water)||v.water<0||!v.checks||typeof v.checks!=='object'||Object.values(v.checks).some(x=>typeof x!=='boolean')||(v.extra!==undefined&&(!Array.isArray(v.extra)||v.extra.some(x=>typeof x!=='string'))))throw Error()}if(a.goals!==undefined&&!validGoals(a.goals))throw Error();if(!confirm('Vorhandene Daten durch diese Sicherung ersetzen?'))return;localStorage.setItem(key,JSON.stringify(a));location.reload()}catch(e){document.getElementById('restoreMsg').textContent='Sicherung ungültig oder Speicherung fehlgeschlagen. Bestehende Daten bleiben erhalten.'}}function exportData(){out.hidden=false;out.value=JSON.stringify(s,null,2);out.select()}show(0);
</script></html>
