el wieder als offen markieren?')){shopState().checked={};save();show(6)}}function shoppingList(){let a=shopState(),end=new Date(a.week+'T12:00:00');end.setDate(end.getDate()+6);return '<details id="shoppingList" open><summary>🛒 Einkaufsliste für 7 Tage</summary><button style="width:100%" onclick="shopInteractive()">Abhakbare Browser-Liste teilen</button><button style="width:100%" onclick="shopShare(true)">Vollständige Liste teilen</button><button style="width:100%" onclick="shopShare(false)">Nur offene Artikel teilen</button><button onclick="shopReset()">Alle Haken entfernen</button><label>Beginn<input type="date" value="'+esc(a.week)+'" onchange="shopDate(this.value)"></label><p>'+fmt(a.week)+' – '+fmt(dayKey(end))+'</p><label>Personen <select onchange="shopPeople(Number(this.value))"><option value="1" '+(a.people===1?'selected':'')+'>1</option><option value="2" '+(a.people===2?'selected':'')+'>2</option></select></label><label><input type="checkbox" '+(a.pack?'checked':'')+' onchange="shopState().pack=this.checked;save();show(6)">Ungefähre Packungsgrößen anzeigen</label><p id="shopCost">'+shopCost()+'</p><small>Beispielportionen, keine vollständige Wochenversorgung. Reis und Linsen gekocht; Fleisch/Fisch als Portionsgewicht. Packungen und Preise sind Richtwerte.</small>'+shopGroups.map(g=>'<h3>'+g+'</h3>'+shopRows().filter(x=>x.group===g).map(x=>'<label><input type="checkbox" '+(a.checked[x.id]?'checked':'')+' onchange="shopCheck(\''+x.id+'\',this.checked);document.getElementById(\'shopCost\').textContent=shopCost()">'+esc(x.name)+' – '+shopAmount(x)+'</label>'+(x.group==='Zusätzlich'?'<button onclick="shopRemove('+x.id.slice(1)+')">Entfernen</button>':'')).join('')).join('')+'<input id="shopName" maxlength="100" placeholder="Eigener Einkaufsartikel"><input id="shopQty" type="number" min="0.1" step="any" placeholder="Menge"><select id="shopUnit"><option>g</option><option>kg</option><option>Stück</option><option>ml</option><option>l</option><option>Packung</option> ittel, nicht zwingend der gesamte Tag. Manuelle Tageswerte werden nicht addiert oder überschrieben.</small><details><summary>Eigene Lebensmittel verwalten</summary><label>Name<input id="customName" maxlength="100"></label><label>kcal je 100 g<input id="customK" type="number" min="0" max="900" step="0.1"></label><label>Eiweiß je 100 g<input id="customP" type="number" min="0" max="100" step="0.1"></label><button onclick="addCustomFood()">Lebensmittel speichern</button><p id="customMsg"></p>'+ (s.customFoods||[]).map((f,i)=>'<p>'+esc(f[0])+' <button onclick="removeCustomFood('+i+')">Entfernen</button></p>').join('')+'</details>'}function logFood(){let choice=document.getElementById('foodChoice').value,f=choice===''?null:allFoods()[Number(choice)],n=Number(document.getElementById('foodGrams').value);if(!f||!Number.isFinite(n)||n<=0||n>2000){document.getElementById('foodMsg').textContent='Bitte gültige Menge eingeben.';return}(d.foodLog||(d.foodLog=[])).push({name:f[0],grams:n,kcal:n*f[1]/100,protein:n*f[2]/100});save();show(1)}function deleteLog(i){d.foodLog.splice(i,1);save();show(1)}function actualNutrition(){let a=d.actual||{};return '<h3>Tatsächliche Nährstoffaufnahme</h3><p>Nur bekannte Tageswerte eintragen, unabhängig von den Beispielmenüs. Leere Felder bedeuten unbekannt.</p><label>Kalorien (kcal)<input id="actualK" type="number" min="0" max="10000" value="'+esc(a.kcal??'')+'"></label><label>Eiweiß (g)<input id="actualP" type="number" min="0" max="500" step="0.1" value="'+esc(a.protein??'')+'"></label><button onclick="saveActual()">Tageswerte speichern</button><p id="actualMsg"></p>'+(Number.isFinite(a.protein)&&Number.isFinite(s.dailyGoals?.protein)&&s.dailyGoals.protein>0?'<p>Erfasst: '+a.protein+' / '+s.dailyGoals.protein+' g Eiweiß</p><progress max="'+s.dailyGoals.protein+'" value="'+a.protein+'"></progress>':'')}function saveActual(){let k=document.getElementById('actualK').value,p=document.getElementById('actualP').value;if((k!==''&&(!Number.isFinite(+k)||+k<0||+k>10000))||(p!==''&&(!Number.isFinite(+p)||+p<0||+p>500))){document.getElementById('actualMsg').textContent='Bitte gültige Werte eingeben.';return}d.actual={kcal:k===''?null:+k,protein:p===''?null:+p};save();show(1);document.getElementById('actualMsg').textContent='Tageswerte gespeichert.'}function tolerance(){return '<h3>Verträglichkeit heute</h3>'+['Nicht bewertet','Gut vertragen','Teilweise vertragen','Schlecht vertragen'].map((t,i)=>'<label><input style="width:24px" type="radio" name="tol" '+((d.tol??0)===i?'checked':'')+' onchange="d.tol='+i+';save()">'+t+'</label>').join('')+'<label>Notizen zur Verträglichkeit<textarea maxlength="1000" onchange="d.tolNote=this.value;save()">'+esc(d.tolNote)+'</textarea></label>'}function dailyGoals(){let q=s.dailyGoals||{};return '<details><summary>Vereinbarte Tagesziele</summary><p>Nur individuell medizinisch abgestimmte Werte eintragen. Keine automatische Kalorienbegrenzung.</p><label>Flüssigkeit (ml)<input id="waterGoal" type="number" min="0" max="5000" value="'+esc(q.water??'')+'"></label><label>Eiweiß (g)<input id="proteinGoal" type="number" min="0" max="300" value="'+esc(q.protein??'')+'"></label><button onclick="saveDailyGoals()">Speichern</button><p id="dailyMsg"></p></details>'}function saveDailyGoals(){let w=document.getElementById('waterGoal').value,p=document.getElementById('proteinGoal').value;if((w!==''&&(!Number.isFinite(+w)||+w<=0||+w>5000))||(p!==''&&(!Number.isFinite(+p)||+p<=0||+p>300))){document.getElementById('dailyMsg').textContent='Bitte gültige Werte eingeben oder leer lassen.';return}s.dailyGoals={water:w===''?null:+w,protein:p===''?null:+p};save();show(1);document.getElementById('dailyMsg').textContent='Gespeichert.'}function menuDetails(){let a=nutrition[now.getDay()];return '<p><strong>Beispielportionen:</strong> '+a.reduce((v,x)=>v+x[0],0)+' kcal / '+a.reduce((v,x)=>v+x[1],0)+' g Eiweiß (grob geschätzt). Dies ist ausdrücklich kein vollständiger Tagesbedarf. Ergänzungen und Tagesziel mit Ernäh ="'+p+'"></progress><p>Veränderung: '+(last?Math.abs(q.start-w).toFixed(1)+' kg '+(w>q.start?'zugenommen':'abgenommen'):'Noch keine Messung')+'</p><p>Zieltermin: '+fmt(q.until)+'</p>'+lamp('Ernährung',[0,1,2,3,4].filter(k=>d.checks[k]).length,5)+lamp('Bewegung',[5,6,7].filter(k=>d.checks[k]).length,3)+'<small>Ampel: Aufgabenstatus, keine medizinische Bewertung.</small><p>Getrunken: '+d.water+' ml</p>'}if(i===1){h='<h2>Ernährung</h2><p>Wechselndes Wochenmenü, kleine verträgliche Portionen. Eiweiß zuerst; nicht über Sättigung hinaus essen.</p>'+menus[now.getDay()].map((t,j)=>check(j,t+'<br><small>'+portions[now.getDay()][j]+' · ca. '+nutrition[now.getDay()][j][0]+' kcal / '+nutrition[now.getDay()][j][1]+' g Eiweiß</small>')).join('')+menuDetails()+planWeek()+'<h3>Zusätzliche Mahlzeiten</h3><p>Hier kannst du weitere tatsächlich gegessene Lebensmittel dokumentieren.</p><input id="extraFood" maxlength="250" placeholder="Lebensmittel und Menge"><button onclick="addFood()">Hinzufügen</button>'+ (d.extra||[]).map((t,j)=>'<p>'+esc(t)+' <button onclick="removeFood('+j+')">Entfernen</button></p>').join('')+'<h3>Trinken: '+d.water+' ml</h3><button onclick="d.water+=100;save();show(1)">+ 100 ml</button> <button onclick="d.water+=250;save();show(1)">+ 250 ml</button> <button onclick="d.water=Math.max(0,d.water-100);save();show(1)">− 100 ml</button> <button onclick="d.water=Math.max(0,d.water-250);save();show(1)">− 250 ml</button><p>Trinkziel ärztlich abstimmen.</p>'+ (Number.isFinite(s.dailyGoals?.water)&&s.dailyGoals.water>0?'<p>Vereinbartes Trinkziel: '+s.dailyGoals.water+' ml</p><progress max="'+s.dailyGoals.water+'" value="'+d.water+'"></progress>':'')+'<button onclick="show(6)">Wocheneinkauf öffnen</button>'+foodCalc()+actualNutrition()+tolerance()+dailyGoals()}if(i===6){h='<h2>Wocheneinkauf</h2>'+shoppingList()}if(i===2){h='<h2>Bewegung</h2><p>Nur ärztlich freigegeben und schmerzfrei. Bei Atemnot, Schwindel oder Schmerzen abbrechen.</p>'+['Kurzer Spaziergang vormittags','Schonende Sitzgymnastik','Kurzer Spaziergang nachmittags'].map((t,j)=>check(j+5,t)).join('')}if(i===3){h='<h2>Gesundheit</h2>'+['Blutdruck (mmHg)','Blutzucker mit Einheit','Beschwerden'].map((t,j)=>'<label>'+t+'<input value="'+esc(d['v'+j])+'" onchange="d[\'v'+j+'\']=this.value;save()"></label>').join('')+'<p>Medikamente nicht eigenständig ändern. Bei akuter schwerer Atemnot, Brustschmerzen oder Bewusstseinsstörungen: 112.</p>'}if(i===4){h='<h2>Gewicht erfassen</h2><input id="kg" type="number" min="30" max="350" step="0.1" placeholder="Gewicht in kg" value="'+(last?w:'')+'"><button onclick="record()">Messung speichern</button><p id="msg"></p><details><summary>Persönliche Ziele einstellen</summary><p>Wunschziel mit ärztlicher Betreuung abstimmen.</p><label>Startgewicht (kg)<input id="gs" type="number" step="0.1" value="'+q.start+'"></label><label>Zielgewicht (kg)<input id="gt" type="number" step="0.1" value="'+q.target+'"></label><label>Startdatum<input id="gf" type="date" value="'+q.from+'"></label><label>Zieltermin<input id="gu" type="date" value="'+q.until+'"></label><button onclick="saveGoals()">Ziele speichern</button><p id="gm" role="status"></p></details>'}if(i===5){h='<h2>Gewichtsverlauf</h2>'+[...s.weights].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<p>'+esc(x.date)+' — '+x.w+' kg</p>').join('')+'<button onclick="exportData()">Datensicherung anzeigen</button><h3>ChatGPT-Auswertung vorbereiten</h3><p>Erstellt einen kopierbaren Wochenbericht mit Gewicht, Verträglichkeit und Nährstoffwerten, ohne Blutdruck, Blutzucker oder Freitext. Nur freiwillig in ChatGPT einfügen; keine automatische Übertragung.</p><button onclick="coachReport()">Wochenbericht erstellen</button><textarea id="coachOut" readonly hidden rows="8"></textarea><button onclick="openCoach()">Bericht kopieren und ChatGPT öffnen</button><p>Vor dem Absenden kannst du den Bericht in ChatGPT prüfen und bearbeiten.</p><h3>Tagesprotokolle</h3>'+Object.keys(s.days).sort().reverse().slice(0,30).map(k=>{let a=s.days[k];return '<details><summary>'+esc(k)+'</summary><p>Getrunken: '+Number(a.water||0)+' ml</p><p>Ernährung: '+[0,1,2,3,4].filter(j=>a.checks?.[j]).length+'/5 · Bewegung: '+[5,6,7].filter(j=>a.checks?.[j]).length+'/3</p><p>Zusätzliche Mahlzeiten: '+esc((a.extra||[]).join('; ')||'Keine erfasst')+'</p><p>Blutdruck: '+esc(a.v0||'Nicht erfasst')+'</p><p>Blutzucker: '+esc(a.v1||'Nicht erfasst')+'</p><p>Beschwerden: '+esc(a.v2||'Nicht erfasst')+'</p><p>Erfasste Kalorien: '+esc(a.actual?.kcal??'Nicht erfasst')+' · Eiweiß: '+esc(a.actual?.protein??'Nicht erfasst')+' g (falls bekannt)</p><p>Verträglichkeit: '+esc(['Nicht bewertet','Gut','Teilweise','Schlecht'][a.tol]||'Nicht bewertet')+'</p><p>Notizen: '+esc(a.tolNote||'Keine')+'</p></details>'}).join('')+'<textarea id="out" readonly hidden></textarea><p><small>Das Protokoll enthält persönliche Gesundheitsdaten. Nur sicher und privat aufbewahren.</small></p>'}if(i===0||i===5)h+=graph();if(i===5)h+=weekly()+monthly()+'<details><summary>Datensicherung wiederherstellen</summary><p>Füge ein zuvor gesichertes JSON-Protokoll ein. Die Wiederherstellung ersetzt die vorhandenen Daten.</p><textarea id="restore" placeholder="JSON-Sicherung einfügen"></textarea><button onclick="restoreData()">Sicherung wiederherstellen</button><p id="restoreMsg" role="status"></p></details>';panel.innerHTML=h}function record(){let w=Number(document.getElementById('kg').value);if(!Number.isFinite(w)||w<30||w>350){msg.textContent='Bitte gültiges Gewicht eingeben';return}s.weights=s.weights.filter(a=>a.date!==date);s.weights.push({date,w});save();msg.textContent='Messung für '+date+' gespeichert. Eine erneute Messung am selben Tag ersetzt diesen Wert.'}function addFood(){let t=document.getElementById('extraFood').value.trim();if(!t)return; (d.extra||(d.extra=[])).push(t);save();show(1)}function removeFood(i){d.extra.splice(i,1);save();show(1)}function restoreData(){try{const a=JSON.parse(document.getElementById('restore').value);if(!a||!Array.isArray(a.weights)||!a.days||typeof a.days!=='object'||Array.isArray(a.days))throw Error();const validDate=k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isFinite(Date.parse(k));if(a.weights.some(x=>!x||!validDate(x.date)||typeof x.w!=='number'||!Number.isFinite(x.w)||x.w<30||x.w>350))throw Error();for(const [k,v] of Object.entries(a.days)){if(!validDate(k)||!v||typeof v!=='object'||!Number.isFinite(v.water)||v.water<0||!v.checks||typeof v.checks!=='object'||Object.values(v.checks).some(x=>typeof x!=='boolean')||(v.extra!==undefined&&(!Array.isArray(v.extra)||v.extra.some(x=>typeof x!=='string'))))throw Error()}for(const v of Object.values(a.days)){if(v.foodLog!==undefined&&(!Array.isArray(v.foodLog)||v.foodLog.some(x=>!x||typeof x.name!=='string'||!['grams','kcal','protein'].every(k=>Number.isFinite(x[k])&&x[k]>=0))))throw Error();if(v.actual!==undefined&&(!v.actual||typeof v.actual!=='object'||Array.isArray(v.actual)||!['kcal','protein'].every(k=>v.actual[k]===null||(Number.isFinite(v.actual[k])&&v.actual[k]>=0&&v.actual[k]<=(k==='kcal'?10000:500)))))throw Error();}if(a.favorites!==undefined&&(!Array.isArray(a.favorites)||a.favorites.some(f=>!Array.isArray(f)||f.length!==3||typeof f[0]!=='string'||!Number.isFinite(f[1])||f[1]<0||f[1]>900||!Number.isFinite(f[2])||f[2]<0||f[2]>100)))throw Error();if(a.customFoods!==undefined&&(!Array.isArray(a.customFoods)||a.customFoods.some(f=>!Array.isArray(f)||f.length!==3||typeof f[0]!=='string'||!Number.isFinite(f[1])||f[1]<0||f[1]>900||!Number.isFinite(f[2])||f[2]<0||f[2]>100)))throw Error();if(a.dailyGoals!==undefined&&(!a.dailyGoals||typeof a.dailyGoals!=='object'||Array.isArray(a.dailyGoals)||!['water','protein'].every(k=>a.dailyGoals[k]===null||(Number.isFinite(a.dailyGoals[k])&&a.dailyGoals[k]>0&&a.dailyGoals[k]<=(k==='water'?5000:300)))))throw Error();if(a.goals!==undefined&&!validGoals(a.goals))throw Error();if(!confirm('Vorhandene Daten durch diese Sicherung ersetzen?'))return;localStorage.setItem(key,JSON.stringify(a));location.reload()}catch(e){document.getElementById('restoreMsg').textContent='Sicherung ungültig oder Speicherung fehlgeschlagen. Bestehende Daten bleiben erhalten.'}}function coachReport(){let a=[...new Set([...Object.keys(s.days),...s.weights.map(x=>x.date)])].filter(k=>k<=date&&Date.parse(k)>=Date.parse(date)-6*86400000).sort();let lines=['Bitte werte mein 7-Tage-Protokoll aus. Nutze nur dokumentierte Angaben. Keine eigenständigen Medikamentenänderungen. Teilprotokolle sind keine vollständige Tagesaufnahme.'];for(let k of a){let v=s.days[k],w=s.weights.find(x=>x.date===k)?.w;let line=fmt(k)+': Gewicht '+(w===undefined?'nicht erfasst':w+' kg');if(v){let f=v.foodLog||[];line+='; Trinkmenge '+(v.water>0?v.water+' ml erfasst':'nicht erfasst oder 0 ml')+'; Mahlzeiten abgehakt '+[0,1,2,3,4].filter(j=>v.checks[j]).length+'/5; Bewegung '+[5,6,7].filter(j=>v.checks[j]).length+'/3; Verträglichkeit '+(['nicht bewertet','gut','teilweise','schlecht'][v.tol]||'nicht bewertet')+'; manuelle Tageswerte '+(v.actual?.kcal??'unbekannt')+' kcal / '+(v.actual?.protein??'unbekannt')+' g Eiweiß';if(f.length)line+='; separates Lebensmittel-Teilprotokoll '+Math.round(f.reduce((n,x)=>n+x.kcal,0))+' kcal / '+f.reduce((n,x)=>n+x.protein,0).toFixed(1)+' g Eiweiß (nicht addieren)';}lines.push(line)}if(!a.length)lines.push('Keine Einträge im Zeitraum.');let el=document.getElementById('coachOut');el.hidden=false;el.value=lines.join('\n');el.select()}function openCoach(){coachReport();if(confirm('Wochenbericht in die Zwischenablage kopieren und ChatGPT öffnen? Es werden keine Daten automatisch gesendet.'))location.href='coach://chatgpt?report='+encodeURIComponent(document.getElementById('coachOut').value)}function exportData(){out.hidden=false;out.value=JSON.stringify(s,null,2);out.select()}show(0);
