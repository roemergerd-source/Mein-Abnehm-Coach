<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Abnehm-Coach</title><style>body{font:18px system-ui;background:#eef4f0;color:#17352b;margin:20px}button,input,textarea{font:inherit;padding:12px;box-sizing:border-box}button{background:#21664b;color:white;border:0;border-radius:6px;margin:4px 0}nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}section{background:white;padding:16px;border-radius:10px;margin-top:16px}input,textarea{width:100%;margin:6px 0}label{display:block;margin:12px 0}input[type=checkbox]{width:24px;height:24px}small{font-size:14px}progress{width:100%}h1{font-size:25px;margin:8px 0 18px}body{padding-top:24px}small{font-size:11px}nav button{min-height:48px}progress{accent-color:#21664b}.lamp{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px}body{padding-bottom:48px}section{padding:12px}section p{margin:12px 0}section h2{margin:12px 0}section h3{margin:16px 0 4px}section svg{max-height:170px}</style><h1>Mein Abnehm-Coach</h1><nav id="nav"></nav><section id="panel"></section><small>© Leobeck 2026 · Kein Ersatz für ärztliche Betreuung.</small><script>
const key='coach-v1',s=JSON.parse(localStorage.getItem(key)||'{"weights":[],"days":{}}');const now=new Date(),date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');const d=s.days[date]||(s.days[date]={water:0,checks:{}});let tab=0;const save=()=>localStorage.setItem(key,JSON.stringify(s));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const menus=[["08:00 Skyr, Haferflocken, Beeren","10:30 Ei und Gurke","12:30 Hähnchen, Kartoffeln, Brokkoli","15:30 Quark und Apfel","18:00 Vollkornbrot und Frischkäse"],["08:00 Rührei und Vollkornbrot","10:30 Naturjoghurt","12:30 Seelachs, Kartoffeln, Möhren","15:30 Skyr und Beeren","18:00 Hüttenkäse und Tomate"],["08:00 Quark, Haferflocken, Birne","10:30 Ei","12:30 Putenbrust, Reis, Zucchini","15:30 Naturjoghurt und Nüsse","18:00 Vollkornbrot und Käse"],["08:00 Haferbrei mit Skyr","10:30 Hüttenkäse","12:30 Linsen mit Gemüse und Ei","15:30 Quark und Beeren","18:00 Vollkornbrot und Putenbrust"],["08:00 Omelett und Tomate","10:30 Skyr","12:30 Lachs, Kartoffeln, Spinat","15:30 Quark und Birne","18:00 Frischkäse und Vollkornbrot"],["08:00 Skyr und Haferflocken","10:30 Ei und Tomate","12:30 Hähnchen, Reis, Gemüse","15:30 Joghurt und Apfel","18:00 Hüttenkäse und Gurke"],["08:00 Vollkornbrot und Ei","10:30 Quark und Beeren","12:30 Pute, Kartoffeln, Blumenkohl","15:30 Skyr","18:00 Käse und Vollkornbrot"]];const names=['Übersicht','Ernährung','Bewegung','Gesundheit','Gewicht','Auswertung'];nav.innerHTML=names.map((n,i)=>'<button onclick="show('+i+')">'+n+'</button>').join('');function check(k,t){return '<label><input type="checkbox" '+(d.checks[k]?'checked':'')+' onchange="d.checks['+k+']=this.checked;save()">'+t+'</label>'}function lamp(n,v,max){return '<p><span class="lamp" style="background:'+(v===max?'#219653':v?'#e4ad20':'#c94a4a')+'"></span>'+n+': '+v+'/'+max+'</p>'}function graph(){const start=Date.parse('2026-11-26'),end=Date.parse('2027-02-26'),pts=s.weights.filter(a=>Number.isFinite(a.w)&&Number.isFinite(Date.parse(a.date)));const lo=Math.min(130,...pts.map(a=>a.w))-1,hi=Math.max(140,...pts.map(a=>a.w))+1;const x=t=>36+Math.max(0,Math.min(1,(t-start)/(end-start)))*240,y=w=>15+(hi-w)/(hi-lo)*115;return '<h3>Gewichtsverlauf</h3><svg viewBox="0 0 300 155" width="100%" role="img" aria-label="Gewichtsverlauf">'+[130,135,140].map(w=>'<line x1="36" x2="276" y1="'+y(w)+'" y2="'+y(w)+'" stroke="#ddd"/><text x="2" y="'+(y(w)+4)+'" font-size="10">'+w+'</text>').join('')+'<path d="M36 '+y(140)+' L276 '+y(130)+'" stroke="#438369" stroke-dasharray="5 4" fill="none"/>'+pts.map(a=>'<circle cx="'+x(Date.parse(a.date))+'" cy="'+y(a.w)+'" r="4" fill="#2466b0"/>').join('')+'<text x="36" y="150" font-size="10">26.11.</text><text x="240" y="150" font-size="10">26.02.</text></svg><small>Gestrichelt: Wunschziel. Blau: Messwerte. Außerhalb des Zielzeitraums liegende Werte am Rand.</small>'} function show(i){tab=i;[...nav.children].forEach((b,j)=>b.style.background=i===j?'#17352b':'#438369');let w=s.weights.at(-1)?.w??140;let p=Math.max(0,Math.min(100,(140-w)*10));let h='';if(i===0){h='<h2>'+w+' kg → 130 kg</h2><progress max="100" value="'+p+'"></progress><p>Veränderung: '+(140-w).toFixed(1)+' kg abgenommen</p><p>Zieltermin: 26.02.2027</p>'+lamp('Ernährung',[0,1,2,3,4].filter(k=>d.checks[k]).length,5)+lamp('Bewegung',[5,6,7].filter(k=>d.checks[k]).length,3)+'<small>Ampel: Aufgabenstatus, keine medizinische Bewertung.</small><p>Getrunken: '+d.water+' ml</p>'}if(i===1){h='<h2>Ernährung</h2><p>Wechselndes Wochenmenü, kleine verträgliche Portionen. Eiweiß zuerst; nicht über Sättigung hinaus essen.</p>'+menus[now.getDay()].map((t,j)=>check(j,t)).join('')+'<h3>Trinken: '+d.water+' ml</h3><button onclick="d.water+=250;save();show(1)">+ 250 ml</button> <button onclick="d.water=Math.max(0,d.water-250);save();show(1)">− 250 ml</button><p>Trinkziel ärztlich abstimmen.</p>'}if(i===2){h='<h2>Bewegung</h2><p>Nur ärztlich freigegeben und schmerzfrei. Bei Atemnot, Schwindel oder Schmerzen abbrechen.</p>'+['Kurzer Spaziergang vormittags','Schonende Sitzgymnastik','Kurzer Spaziergang nachmittags'].map((t,j)=>check(j+5,t)).join('')}if(i===3){h='<h2>Gesundheit</h2>'+['Blutdruck (mmHg)','Blutzucker mit Einheit','Beschwerden'].map((t,j)=>'<label>'+t+'<input value="'+esc(d['v'+j])+'" onchange="d[\'v'+j+'\']=this.value;save()"></label>').join('')+'<p>Medikamente nicht eigenständig ändern.</p>'}if(i===4){h='<h2>Gewicht erfassen</h2><input id="kg" type="number" min="30" max="350" step="0.1" value="'+w+'"><button onclick="record()">Messung speichern</button><p id="msg"></p>'}if(i===5){h='<h2>Gewichtsverlauf</h2>'+s.weights.map(x=>'<p>'+esc(x.date)+' — '+x.w+' kg</p>').join('')+'<button onclick="exportData()">Protokoll anzeigen</button><textarea id="out" readonly hidden></textarea>'}if(i===0||i===5)h+=graph();panel.innerHTML=h}function record(){let w=Number(document.getElementById('kg').value);if(!Number.isFinite(w)||w<30||w>350){msg.textContent='Bitte gültiges Gewicht eingeben';return}s.weights.push({date,w});save();msg.textContent='Gespeichert'}function exportData(){out.hidden=false;out.value=JSON.stringify(s,null,2);out.select()}show(0);
</script></html>
