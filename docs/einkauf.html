<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unser Wocheneinkauf</title><style>body{font:18px system-ui;background:#eef4f0;color:#17352b;margin:16px}main{max-width:650px;margin:auto;background:white;padding:16px;border-radius:12px}label{display:flex;align-items:center;gap:12px;min-height:48px}input{width:24px;height:24px;accent-color:#21664b}label:has(input:checked){text-decoration:line-through;color:#68776e}button{font:inherit;padding:12px;background:#21664b;color:white;border:0;border-radius:6px}progress{width:100%;accent-color:#21664b}</style><main><h1>🛒 Unser Wocheneinkauf</h1><p id="info"></p><p id="status"></p><progress id="progress" value="0" max="1"></progress><div id="list"></div><button id="reset" hidden>Alle Haken entfernen</button><button id="send" hidden>Bearbeitete Liste zurücksenden</button><p><small>Haken werden lokal gespeichert. Änderungen bitte zurücksenden. Keine Live-Synchronisierung. © Leobeck 2026</small></p></main><script>try{let raw=location.hash.slice(1);if(!raw||raw.length>50000)throw Error();let data=JSON.parse(decodeURIComponent(raw));if(!Array.isArray(data.rows)||data.rows.length>500||!data.rows.length||data.rows.some(x=>!Array.isArray(x)||x.length!==2||x.some(y=>typeof y!=='string'||y.length>300)))throw Error();let key='shopping:'+raw,checked={};try{checked=JSON.parse(localStorage.getItem(key)||'null')||Object.fromEntries((Array.isArray(data.checked)?data.checked:[]).map((v,i)=>[i,v===true]))}catch(e){}let info=document.getElementById('info'),list=document.getElementById('list'),status=document.getElementById('status'),progress=document.getElementById('progress'),reset=document.getElementById('reset');info.textContent=String(data.title||'');function update(){let n=data.rows.filter((x,i)=>checked[i]).length;status.textContent=n+' von '+data.rows.length+' erledigt';progress.max=data.rows.length;progress.value=n;try{localStorage.setItem(key,JSON.stringify(checked))}catch(e){status.textContent+=' · Speicherung nicht verfügbar'}}let last='';data.rows.forEach((x,i)=>{if(x[0]!==last){let h=document.createElement('h2');h.textContent=x[0];list.append(h);last=x[0]}let label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=!!checked[i];box.onchange=()=>{checked[i]=box.checked;update()};label.append(box,document.createTextNode(x[1]));list.append(label)});let send=document.getElementById('send');send.hidden=false;send.onclick=async()=>{let payload={title:data.title,rows:data.rows,checked:data.rows.map((x,i)=>!!checked[i])};let url=location.origin+location.pathname+'#'+encodeURIComponent(JSON.stringify(payload));let message='Bearbeiteter Einkaufszettel:\n'+url;try{if(navigator.share){await navigator.share({text:message});return}if(navigator.clipboard){await navigator.clipboard.writeText(message);alert('Link kopiert. Bitte per Nachricht senden.');return}}catch(e){if(e.name==='AbortError')return}prompt('Link kopieren und zurücksenden:',message)};reset.hidden=false;reset.onclick=()=>{if(confirm('Alle Haken entfernen?')){checked={};list.querySelectorAll('input').forEach(x=>x.checked=false);update()}};update()}catch(e){document.getElementById('info').textContent='Keine gültige Einkaufsliste. Bitte den vollständigen Link aus der App öffnen.'}</script></html>
