name: Android APK erstellen
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Vorinstalliertes Android SDK prüfen
        run: |
          echo "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --stacktrace
      - name: APK dauerhaft signieren
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          umask 077
          KS="$RUNNER_TEMP/coach.p12"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          if ! keytool -list -storetype PKCS12 -keystore "$KS" -storepass:env KEYSTORE_PASSWORD >/dev/null 2>&1; then
            export KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
            if ! keytool -list -storetype PKCS12 -keystore "$KS" -storepass:env KEYSTORE_PASSWORD >/dev/null 2>&1; then
              echo "::error::PKCS12 konnte nicht geöffnet werden. Schlüssel und Passwort gemeinsam prüfen."
              exit 1
            fi
          fi
          echo "PKCS12 erfolgreich geöffnet."
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$SIGNER"
          mkdir -p signed
          "$SIGNER" sign --ks "$KS" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out signed/Mein-Abnehm-Coach.apk app/build/outputs/apk/debug/app-debug.apk
          "$SIGNER" verify --verbose --print-certs signed/Mein-Abnehm-Coach.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mein-Abnehm-Coach-APK
          path: signed/Mein-Abnehm-Coach.apk
